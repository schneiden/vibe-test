<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jack's Portfolio - Multiplayer Snake Game</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #22c55e;
    --accent-dark: #15803d;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
    --input-bg: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .screen { display: none; }
  .screen.active { display: flex; }

  /* ---------- MENU ---------- */
  .menu-screen {
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  .menu-screen h1 {
    font-size: 48px;
    letter-spacing: 4px;
    color: var(--accent);
    margin: 0;
  }
  .menu-screen .subtitle {
    color: var(--muted);
    font-size: 16px;
    margin-top: -12px;
  }
  .menu-card {
    background: var(--panel);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .menu-card label {
    font-size: 14px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .menu-card .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }
  input[type="text"], input[type="number"], select {
    background: var(--input-bg);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--accent); }
  input[type="text"]::placeholder, input[type="number"]::placeholder { color: var(--muted); }
  select { cursor: pointer; }
  select option { background: var(--input-bg); color: var(--text); }
  .inline-row {
    display: flex;
    gap: 10px;
  }
  .inline-row > label { flex: 1; }
  .btn-row { display: flex; gap: 10px; }
  button {
    background: var(--accent);
    color: #062312;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    flex: 1;
  }
  button:hover { background: var(--accent-dark); color: white; }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: var(--input-bg);
    color: var(--text);
  }
  button.secondary:hover { background: #475569; }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button:disabled:hover { background: var(--accent); color: #062312; }
  .error-msg {
    color: var(--danger);
    font-size: 14px;
    min-height: 20px;
  }
  .divider {
    border: 0;
    border-top: 1px solid #334155;
    margin: 4px 0;
  }
  .skin-picker-wrap { display: flex; flex-direction: column; gap: 6px; }
  .skin-picker-label { font-size: 14px; color: var(--muted); }
  .skin-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .skin-option {
    flex: unset;
    background: var(--input-bg);
    color: var(--text);
    padding: 6px 4px 4px;
    border-radius: 8px;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .skin-option:hover { background: #475569; color: var(--text); }
  .skin-option.selected {
    border-color: var(--accent);
    background: rgba(34,197,94,0.12);
    color: var(--text);
  }
  .skin-option canvas {
    width: 80px;
    height: 28px;
    background: #0b1222;
    border-radius: 4px;
    display: block;
  }
  .skin-option span { pointer-events: none; }
  .color-picker-wrap { display: flex; flex-direction: column; gap: 6px; }
  .color-picker-label { font-size: 14px; color: var(--muted); }
  .color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-dot {
    flex: unset;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid transparent;
    padding: 0;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }

  /* ---------- LOBBY ---------- */
  .lobby-screen {
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }
  .lobby-screen h1 { margin: 0; font-size: 32px; color: var(--accent); }
  .room-code {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 8px;
    color: var(--text);
    background: var(--panel);
    padding: 12px 28px;
    border-radius: 12px;
    user-select: all;
  }
  .player-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 320px;
  }
  .player-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--panel);
    border-radius: 8px;
    font-size: 16px;
  }
  .player-list .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .player-slot-empty {
    padding: 8px 12px;
    background: var(--panel);
    border-radius: 8px;
    font-size: 14px;
    color: var(--muted);
    border: 2px dashed #334155;
    text-align: center;
  }
  .lobby-hint { color: var(--muted); font-size: 14px; text-align: center; max-width: 340px; }
  .lobby-status {
    font-size: 16px;
    color: var(--muted);
    text-align: center;
  }
  .lobby-status b { color: var(--accent); }
  .host-badge {
    font-size: 11px;
    background: var(--accent);
    color: #062312;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
    margin-left: auto;
  }

  .lobby-customize {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--panel);
    padding: 14px 18px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
  }
  .lobby-custom-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lobby-custom-row.hidden { display: none; }
  .lobby-custom-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .lobby-custom-row .color-picker { gap: 6px; }
  .lobby-custom-row .color-dot { width: 26px; height: 26px; border-width: 2px; }
  .lobby-custom-row select {
    padding: 8px 10px;
    font-size: 14px;
  }

  /* ---------- GAME ---------- */
  .game-screen {
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 10px;
  }
  .game-header {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
  }
  .game-header .room-label {
    color: var(--muted);
    font-size: 14px;
  }
  .game-header .room-label b { color: var(--text); }
  .board-wrap {
    position: relative;
    background: var(--panel);
    padding: 8px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: #0b1222;
    border-radius: 8px;
  }
  .death-overlay {
    position: absolute;
    inset: 8px;
    border-radius: 8px;
    background: rgba(15,23,42,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--danger);
    pointer-events: none;
  }
  .death-overlay.hidden { display: none; }
  .winner-overlay {
    position: absolute;
    inset: 8px;
    border-radius: 8px;
    background: rgba(15,23,42,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .winner-overlay.hidden { display: none; }
  .winner-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }
  .winner-label {
    font-size: 18px;
    letter-spacing: 6px;
    color: #fbbf24;
    font-weight: 700;
  }
  .winner-name {
    font-size: 40px;
    font-weight: 800;
    color: var(--text);
  }
  .winner-score {
    font-size: 20px;
    color: var(--muted);
  }
  .winner-hint {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .scoreboard {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .sb-player {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--panel);
    border-radius: 8px;
    font-size: 14px;
    white-space: nowrap;
  }
  .sb-player .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sb-player .sb-score { font-weight: 700; }
  .sb-player.dead { opacity: 0.4; }
  .game-controls {
    display: flex;
    gap: 10px;
  }
  .game-controls button {
    padding: 8px 16px;
    font-size: 14px;
    flex: unset;
  }

  /* lobby start button */
  .lobby-start-btn {
    flex: 0 0 auto;
    width: auto;
    max-width: 220px;
    padding: 10px 20px;
    font-size: 15px;
    align-self: center;
  }

  /* virtual joystick */
  .joystick-zone {
    display: none;
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 140px;
    height: 140px;
    z-index: 100;
  }
  .joystick-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.04) 60%, rgba(255,255,255,0.02) 100%);
    border: 2px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
  }
  .joystick-knob {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
    border: 2px solid rgba(255,255,255,0.25);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.2);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    pointer-events: none;
  }
  .joystick-arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .joystick-arrows span {
    position: absolute;
    font-size: 14px;
    color: rgba(255,255,255,0.25);
  }
  .joystick-arrows .j-up    { top: 6px; left: 50%; transform: translateX(-50%); }
  .joystick-arrows .j-down  { bottom: 6px; left: 50%; transform: translateX(-50%); }
  .joystick-arrows .j-left  { left: 8px; top: 50%; transform: translateY(-50%); }
  .joystick-arrows .j-right { right: 8px; top: 50%; transform: translateY(-50%); }

  @media (pointer: coarse) {
    .joystick-zone { display: block; }
  }
  @media (max-width: 840px) {
    canvas { width: 100% !important; height: auto !important; }
  }
</style>
</head>
<body>

<!-- MENU SCREEN -->
<div id="menu-screen" class="screen menu-screen active">
  <h1>Jack's Portfolio</h1>
  <p class="subtitle">Multiplayer Snake Game</p>
  <div class="menu-card">
    <label>Your name
      <input type="text" id="name-input" placeholder="Enter name" maxlength="16" />
    </label>

    <div class="skin-picker-wrap">
      <div class="skin-picker-label">Your snake</div>
      <div class="skin-picker" id="skin-picker">
        <button type="button" class="skin-option selected" data-skin="classic">
          <canvas width="80" height="28"></canvas>
          <span>Classic</span>
        </button>
        <button type="button" class="skin-option" data-skin="pixel">
          <canvas width="80" height="28"></canvas>
          <span>Pixel</span>
        </button>
        <button type="button" class="skin-option" data-skin="neon">
          <canvas width="80" height="28"></canvas>
          <span>Neon</span>
        </button>
        <button type="button" class="skin-option" data-skin="striped">
          <canvas width="80" height="28"></canvas>
          <span>Striped</span>
        </button>
      </div>
    </div>

    <div class="color-picker-wrap">
      <div class="color-picker-label">Snake color</div>
      <div class="color-picker" id="color-picker">
        <button type="button" class="color-dot selected" data-color="#22c55e" style="background:#22c55e" title="Green"></button>
        <button type="button" class="color-dot" data-color="#FF0000" style="background:#FF0000" title="Red"></button>
        <button type="button" class="color-dot" data-color="#FF7F00" style="background:#FF7F00" title="Orange"></button>
        <button type="button" class="color-dot" data-color="#FFFF00" style="background:#FFFF00" title="Yellow"></button>
        <button type="button" class="color-dot" data-color="#ffb8c6" style="background:#ffb8c6" title="Pink"></button>
        <button type="button" class="color-dot" data-color="#0000FF" style="background:#0000FF" title="Blue"></button>
        <button type="button" class="color-dot" data-color="#6ECEDA" style="background:#6ECEDA" title="Indigo"></button>
        <button type="button" class="color-dot" data-color="#C9CBE0" style="background:#C9CBE0" title="Violet"></button>
      </div>
    </div>

    <hr class="divider" />
    <p class="section-title">Create a room</p>
    <label>Room name
      <input type="text" id="room-name-input" placeholder="e.g. JJ's room" maxlength="32" />
    </label>
    <label>Number of players
      <select id="max-players-select">
        <option value="1">1 player (Solo)</option>
        <option value="2" selected>2 players</option>
        <option value="3">3 players</option>
        <option value="4">4 players</option>
        <option value="5">5 players</option>
        <option value="6">6 players</option>
        <option value="7">7 players</option>
        <option value="8">8 players</option>
      </select>
    </label>
    <label>Map theme
      <select id="map-select">
        <option value="dark" selected>Dark (classic)</option>
        <option value="ocean">Ocean</option>
        <option value="grassland">Grassland</option>
        <option value="moon">Moon</option>
        <option value="city">City</option>
      </select>
    </label>
    <div class="btn-row">
      <button id="create-btn">Create Room</button>
    </div>

    <hr class="divider" />
    <p class="section-title">Join a room</p>
    <label>Room code
      <input type="text" id="code-input" placeholder="e.g. ABCD" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;text-align:center" />
    </label>
    <div class="btn-row">
      <button id="join-btn" class="secondary">Join Room</button>
    </div>
    <div class="error-msg" id="menu-error"></div>
  </div>
</div>

<!-- LOBBY SCREEN -->
<div id="lobby-screen" class="screen lobby-screen">
  <h1 id="lobby-room-name">Lobby</h1>
  <div class="room-code" id="lobby-code"></div>
  <p class="lobby-hint">Share this code with friends so they can join.</p>
  <p class="lobby-status" id="lobby-status"></p>

  <div class="lobby-customize" id="lobby-customize">
    <div class="lobby-custom-row">
      <div class="lobby-custom-label">Your snake</div>
      <div class="skin-picker" id="lobby-skin-picker">
        <button type="button" class="skin-option" data-skin="classic">
          <canvas width="72" height="24"></canvas>
          <span>Classic</span>
        </button>
        <button type="button" class="skin-option" data-skin="pixel">
          <canvas width="72" height="24"></canvas>
          <span>Pixel</span>
        </button>
        <button type="button" class="skin-option" data-skin="neon">
          <canvas width="72" height="24"></canvas>
          <span>Neon</span>
        </button>
        <button type="button" class="skin-option" data-skin="striped">
          <canvas width="72" height="24"></canvas>
          <span>Striped</span>
        </button>
      </div>
    </div>

    <div class="lobby-custom-row">
      <div class="lobby-custom-label">Color</div>
      <div class="color-picker" id="lobby-color-picker">
        <button type="button" class="color-dot" data-color="#22c55e" style="background:#22c55e"></button>
        <button type="button" class="color-dot" data-color="#FF0000" style="background:#FF0000"></button>
        <button type="button" class="color-dot" data-color="#FF7F00" style="background:#FF7F00"></button>
        <button type="button" class="color-dot" data-color="#FFFF00" style="background:#FFFF00"></button>
        <button type="button" class="color-dot" data-color="#ffb8c6" style="background:#ffb8c6"></button>
        <button type="button" class="color-dot" data-color="#0000FF" style="background:#0000FF"></button>
        <button type="button" class="color-dot" data-color="#6ECEDA" style="background:#6ECEDA"></button>
        <button type="button" class="color-dot" data-color="#C9CBE0" style="background:#C9CBE0"></button>
      </div>
    </div>

    <div class="lobby-custom-row host-only" id="lobby-map-row">
      <div class="lobby-custom-label">Map theme (host only)</div>
      <select id="lobby-map-select">
        <option value="dark">Dark (classic)</option>
        <option value="ocean">Ocean</option>
        <option value="grassland">Grassland</option>
        <option value="moon">Moon</option>
        <option value="city">City</option>
      </select>
    </div>
  </div>

  <ul class="player-list" id="lobby-players"></ul>
  <button id="start-game-btn" class="lobby-start-btn" disabled>Waiting for players...</button>
  <p class="lobby-hint" id="lobby-host-hint"></p>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen game-screen">
  <div class="game-header">
    <span class="room-label" id="game-room-label"></span>
  </div>
  <div class="scoreboard" id="scoreboard"></div>
  <div class="board-wrap">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="death-overlay" class="death-overlay hidden">Respawning...</div>
    <div id="winner-overlay" class="winner-overlay hidden">
      <div class="winner-card">
        <div class="winner-label">WINNER</div>
        <div class="winner-name" id="winner-name"></div>
        <div class="winner-score" id="winner-score"></div>
        <button id="play-again-btn" style="margin-top:12px;max-width:200px">Play Again</button>
        <p class="winner-hint" id="winner-hint"></p>
      </div>
    </div>
  </div>
  <div class="game-controls">
    <button id="leave-btn" class="secondary">Leave</button>
  </div>
  <div class="joystick-zone" id="joystick">
    <div class="joystick-base"></div>
    <div class="joystick-arrows">
      <span class="j-up">&#9650;</span>
      <span class="j-down">&#9660;</span>
      <span class="j-left">&#9664;</span>
      <span class="j-right">&#9654;</span>
    </div>
    <div class="joystick-knob" id="joystick-knob"></div>
  </div>
</div>

<script>
(() => {
  const menuScreen = document.getElementById('menu-screen');
  const lobbyScreen = document.getElementById('lobby-screen');
  const gameScreen = document.getElementById('game-screen');
  const screens = [menuScreen, lobbyScreen, gameScreen];

  function showScreen(screen) {
    screens.forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  const nameInput = document.getElementById('name-input');
  const roomNameInput = document.getElementById('room-name-input');
  const maxPlayersSelect = document.getElementById('max-players-select');
  const mapSelect = document.getElementById('map-select');
  const skinPicker = document.getElementById('skin-picker');
  let selectedSkin = localStorage.getItem('snake.skin') || 'classic';
  let selectedColor = localStorage.getItem('snake.color') || '#22c55e';
  const colorPicker = document.getElementById('color-picker');
  const codeInput = document.getElementById('code-input');
  const createBtn = document.getElementById('create-btn');
  const joinBtn = document.getElementById('join-btn');
  const menuError = document.getElementById('menu-error');
  const lobbyRoomName = document.getElementById('lobby-room-name');
  const lobbyCode = document.getElementById('lobby-code');
  const lobbyStatus = document.getElementById('lobby-status');
  const lobbyPlayers = document.getElementById('lobby-players');
  const startGameBtn = document.getElementById('start-game-btn');
  const lobbyHostHint = document.getElementById('lobby-host-hint');
  const lobbySkinPicker = document.getElementById('lobby-skin-picker');
  const lobbyColorPicker = document.getElementById('lobby-color-picker');
  const lobbyMapRow = document.getElementById('lobby-map-row');
  const lobbyMapSelect = document.getElementById('lobby-map-select');
  const gameRoomLabel = document.getElementById('game-room-label');
  const scoreboard = document.getElementById('scoreboard');
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const deathOverlay = document.getElementById('death-overlay');
  const winnerOverlay = document.getElementById('winner-overlay');
  const winnerName = document.getElementById('winner-name');
  const winnerScore = document.getElementById('winner-score');
  const winnerHint = document.getElementById('winner-hint');
  const playAgainBtn = document.getElementById('play-again-btn');
  const leaveBtn = document.getElementById('leave-btn');

  let ws = null;
  let myId = null;
  let roomCode = null;
  let lastState = null;
  let isHost = false;

  nameInput.value = localStorage.getItem('snake.name') || '';

  function getName() {
    const n = nameInput.value.trim() || 'Player';
    localStorage.setItem('snake.name', n);
    return n;
  }

  function connect() {
    return new Promise((resolve, reject) => {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${proto}://${location.host}`;
      ws = new WebSocket(url);
      ws.onopen = () => resolve();
      ws.onerror = () => reject(new Error('Connection failed'));
      ws.onclose = () => {
        if (lastState) {
          showScreen(menuScreen);
          menuError.textContent = 'Disconnected from server.';
          lastState = null;
        }
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleMessage(msg);
      };
    });
  }

  function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  function handleMessage(msg) {
    if (msg.type === 'joined') {
      myId = msg.playerId;
      roomCode = msg.code;
      menuError.textContent = '';
    }
    else if (msg.type === 'error') {
      menuError.textContent = msg.message;
    }
    else if (msg.type === 'lobby') {
      showScreen(lobbyScreen);
      isHost = (msg.hostId === myId);
      lobbyRoomName.textContent = msg.roomName;
      lobbyCode.textContent = msg.code;
      lobbyStatus.innerHTML = `Players: <b>${msg.players.length} / ${msg.maxPlayers}</b>`;

      // sync my skin/color from server state (in case server validated/rejected)
      const me = msg.players.find(p => p.id === myId);
      if (me) {
        if (me.color) selectedColor = me.color;
        if (me.skin) selectedSkin = me.skin;
      }
      renderLobbyPickers();

      // map row: only host can change
      lobbyMapRow.classList.toggle('hidden', !isHost);
      if (msg.mapTheme) lobbyMapSelect.value = msg.mapTheme;

      lobbyPlayers.innerHTML = '';
      msg.players.forEach(p => {
        const li = document.createElement('li');
        const youTag = p.id === myId ? ' (you)' : '';
        const hostTag = p.id === msg.hostId ? `<span class="host-badge">HOST</span>` : '';
        li.innerHTML = `<span class="dot" style="background:${p.color}"></span> ${esc(p.name)}${youTag}${hostTag}`;
        lobbyPlayers.appendChild(li);
      });
      const emptySlots = msg.maxPlayers - msg.players.length;
      for (let i = 0; i < emptySlots; i++) {
        const li = document.createElement('li');
        li.className = 'player-slot-empty';
        li.textContent = 'Waiting for player...';
        lobbyPlayers.appendChild(li);
      }

      const ready = msg.players.length >= msg.maxPlayers;
      if (isHost) {
        startGameBtn.style.display = '';
        startGameBtn.disabled = !ready;
        startGameBtn.textContent = ready ? 'Start Game' : `Waiting for ${emptySlots} more player${emptySlots > 1 ? 's' : ''}...`;
        lobbyHostHint.textContent = ready ? 'All players are here! Click Start Game to begin.' : '';
      } else {
        startGameBtn.style.display = 'none';
        lobbyHostHint.textContent = ready
          ? 'All players are here! Waiting for the host to start the game...'
          : `Waiting for ${emptySlots} more player${emptySlots > 1 ? 's' : ''} to join...`;
      }
    }
    else if (msg.type === 'state') {
      if (!lastState) showScreen(gameScreen);
      lastState = msg;
      gameRoomLabel.innerHTML = `<b>${esc(msg.roomName)}</b> &middot; Room <b style="letter-spacing:2px">${esc(roomCode)}</b> &middot; First to <b>${msg.winScore}</b> wins`;
      updateScoreboard(msg.players);
      draw(msg);
      const me = msg.players.find(p => p.id === myId);
      const finished = msg.state === 'finished' && msg.winner;

      if (finished) {
        deathOverlay.classList.add('hidden');
        winnerOverlay.classList.remove('hidden');
        winnerName.textContent = msg.winner.name;
        winnerName.style.color = msg.winner.color;
        winnerScore.textContent = `Score: ${msg.winner.score}`;
        if (isHost) {
          playAgainBtn.style.display = '';
          winnerHint.textContent = 'Click Play Again to start a new match.';
        } else {
          playAgainBtn.style.display = 'none';
          winnerHint.textContent = 'Waiting for the host to start a new match...';
        }
      } else {
        winnerOverlay.classList.add('hidden');
        deathOverlay.classList.toggle('hidden', !me || me.alive);
      }
    }
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateScoreboard(players) {
    scoreboard.innerHTML = '';
    const sorted = [...players].sort((a, b) => b.score - a.score);
    sorted.forEach(p => {
      const div = document.createElement('div');
      div.className = 'sb-player' + (p.alive ? '' : ' dead');
      div.innerHTML = `<span class="dot" style="background:${p.color}"></span>
        <span>${esc(p.name)}</span>
        <span class="sb-score">${p.score}</span>`;
      scoreboard.appendChild(div);
    });
  }

  function drawMapBackground(theme) {
    const W = canvas.width, H = canvas.height;
    if (theme === 'ocean') {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a2463');
      g.addColorStop(1, '#1b3a5c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(100,180,255,0.10)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const y = (H / 6) * i + ((Date.now() / 120 + i * 40) % (H / 6));
        ctx.beginPath();
        for (let x = 0; x <= W; x += 12) {
          const yy = y + Math.sin((x + Date.now() / 80) / 40) * 4;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      return 'rgba(120,200,255,0.12)';
    }
    if (theme === 'grassland') {
      const sky = ctx.createLinearGradient(0, 0, 0, H * 0.6);
      sky.addColorStop(0, '#87ceeb');
      sky.addColorStop(1, '#b0e0e6');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H * 0.6);
      const grass = ctx.createLinearGradient(0, H * 0.6, 0, H);
      grass.addColorStop(0, '#4caf50');
      grass.addColorStop(1, '#2e7d32');
      ctx.fillStyle = grass;
      ctx.fillRect(0, H * 0.6, W, H * 0.4);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      const clouds = [[80, 60, 40], [320, 100, 50], [620, 50, 35], [500, 140, 45]];
      clouds.forEach(([cx, cy, r]) => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.arc(cx + r * 0.8, cy + 5, r * 0.7, 0, Math.PI * 2);
        ctx.arc(cx - r * 0.8, cy + 5, r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });
      return 'rgba(30,80,30,0.15)';
    }
    if (theme === 'moon') {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1a1a2e');
      g.addColorStop(1, '#2b2d42');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      const stars = 60;
      for (let i = 0; i < stars; i++) {
        const sx = (i * 137) % W;
        const sy = (i * 91) % H;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }
      ctx.fillStyle = 'rgba(200,200,220,0.08)';
      const craters = [[120, 180, 35], [500, 350, 45], [680, 120, 28], [250, 480, 40], [600, 520, 30]];
      craters.forEach(([cx, cy, r]) => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      });
      return 'rgba(180,180,200,0.10)';
    }
    if (theme === 'city') {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0e27');
      g.addColorStop(1, '#1a1f4a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#0c1440';
      const buildings = [[0, 380, 90], [100, 340, 70], [180, 400, 110], [300, 300, 80], [390, 360, 100], [500, 380, 70], [580, 320, 90], [680, 360, 120]];
      buildings.forEach(([x, y, h]) => {
        ctx.fillRect(x, y, 80, H - y);
      });
      const lightColors = ['#fbbf24', '#60a5fa', '#f472b6', '#34d399'];
      for (let i = 0; i < 80; i++) {
        const lx = (i * 73) % W;
        const ly = 300 + ((i * 41) % 300);
        ctx.fillStyle = lightColors[i % 4];
        ctx.globalAlpha = 0.5 + ((i * 7) % 100) / 200;
        ctx.fillRect(lx, ly, 3, 3);
      }
      ctx.globalAlpha = 1;
      return 'rgba(0,255,255,0.08)';
    }
    ctx.fillStyle = '#0b1222';
    ctx.fillRect(0, 0, W, H);
    return 'rgba(51,65,85,0.2)';
  }

  function draw(state) {
    const COLS = state.cols;
    const ROWS = state.rows;
    const CELL = canvas.width / COLS;

    const gridColor = drawMapBackground(state.mapTheme || 'dark');

    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(canvas.width, j * CELL);
      ctx.stroke();
    }

    state.food.forEach(f => {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(f.x * CELL + CELL / 2, f.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();
    });

    if (state.goldFood) {
      state.goldFood.forEach(g => {
        const gx = g.x * CELL + CELL / 2;
        const gy = g.y * CELL + CELL / 2;
        const pulse = 0.38 + Math.sin(Date.now() / 200) * 0.06;
        const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, CELL * 0.6);
        grad.addColorStop(0, '#fef3c7');
        grad.addColorStop(0.5, '#fbbf24');
        grad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(gx, gy, CELL * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }

    state.players.forEach(p => {
      if (!p.alive || p.snake.length === 0) return;
      drawSnake(ctx, p.snake, p.dir, p.color, p.skin || 'classic', CELL);

      const head = p.snake[0];
      const cx = head.x * CELL + CELL / 2;
      ctx.font = '11px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      ctx.textAlign = 'center';
      ctx.strokeText(p.name, cx, head.y * CELL - 4);
      ctx.fillText(p.name, cx, head.y * CELL - 4);
    });
  }

  function drawSnake(ctx, snake, dir, color, skin, CELL) {
    const rgb = hexToRgb(color);
    if (skin === 'pixel') {
      for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const alt = (i % 2 === 0);
        ctx.fillStyle = alt ? color : `rgb(${Math.max(0,rgb.r-40)},${Math.max(0,rgb.g-40)},${Math.max(0,rgb.b-40)})`;
        ctx.fillRect(s.x * CELL, s.y * CELL, CELL, CELL);
        ctx.fillStyle = `rgba(255,255,255,${i === 0 ? 0.25 : 0.12})`;
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, 2);
        ctx.fillStyle = `rgba(0,0,0,${i === 0 ? 0.25 : 0.15})`;
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + CELL - 3, CELL - 2, 2);
      }
      drawHeadEyes(ctx, snake[0], dir, CELL, '#0b1222', true);
      return;
    }
    if (skin === 'neon') {
      ctx.save();
      for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const alpha = i === 0 ? 1 : Math.max(0.4, 0.9 - (i / snake.length) * 0.55);
        ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.22})`;
        ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = i === 0 ? 14 : 8;
        const pad = 2;
        roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
      drawHeadEyes(ctx, snake[0], dir, CELL, color, false);
      return;
    }
    if (skin === 'striped') {
      for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const stripe = (i % 2 === 0);
        ctx.fillStyle = stripe ? color : '#fef3c7';
        const pad = 1;
        roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, CELL * 0.45);
        ctx.fill();
        if (stripe) {
          ctx.fillStyle = `rgba(255,255,255,${i === 0 ? 0.3 : 0.18})`;
          ctx.beginPath();
          ctx.arc(s.x * CELL + CELL * 0.35, s.y * CELL + CELL * 0.35, CELL * 0.12, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      drawHeadEyes(ctx, snake[0], dir, CELL, '#0b1222', true);
      return;
    }
    // classic
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const alpha = i === 0 ? 1 : Math.max(0.35, 0.9 - (i / snake.length) * 0.55);
      ctx.fillStyle = i === 0 ? color : `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
      const pad = i === 0 ? 1 : 2;
      roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 3);
      ctx.fill();
    }
    drawHeadEyes(ctx, snake[0], dir, CELL, '#0b1222', false);
  }

  function drawHeadEyes(ctx, head, dir, CELL, eyeColor, whiteRim) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const offX = dir.x * CELL * 0.18;
    const offY = dir.y * CELL * 0.18;
    const perpX = -dir.y * CELL * 0.2;
    const perpY = dir.x * CELL * 0.2;
    const r = CELL * 0.1;
    if (whiteRim) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx + offX + perpX, cy + offY + perpY, r + 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + offX - perpX, cy + offY - perpY, r + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = eyeColor;
    ctx.beginPath(); ctx.arc(cx + offX + perpX, cy + offY + perpY, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + offX - perpX, cy + offY - perpY, r, 0, Math.PI * 2); ctx.fill();
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const keyMap = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', e => {
    const m = keyMap[e.key];
    if (m) {
      send({ type: 'dir', x: m[0], y: m[1] });
      e.preventDefault();
    }
  });

  // virtual joystick
  const joystickEl = document.getElementById('joystick');
  const knobEl = document.getElementById('joystick-knob');
  let joystickActive = false;
  let lastJoystickDir = null;
  const JOYSTICK_RADIUS = 70;
  const KNOB_MAX = 36;
  const DEAD_ZONE = 12;

  function getJoystickCenter() {
    const rect = joystickEl.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }

  function handleJoystickMove(cx, cy, tx, ty) {
    let dx = tx - cx;
    let dy = ty - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > KNOB_MAX) {
      dx = (dx / dist) * KNOB_MAX;
      dy = (dy / dist) * KNOB_MAX;
    }
    knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    if (dist < DEAD_ZONE) return;
    let dir;
    if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
    else dir = dy > 0 ? 'down' : 'up';
    if (dir !== lastJoystickDir) {
      lastJoystickDir = dir;
      const dirs = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
      send({ type: 'dir', x: dirs[dir][0], y: dirs[dir][1] });
    }
  }

  function resetKnob() {
    knobEl.style.transform = 'translate(-50%, -50%)';
    lastJoystickDir = null;
    joystickActive = false;
  }

  joystickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    joystickActive = true;
    const t = e.touches[0];
    const c = getJoystickCenter();
    handleJoystickMove(c.x, c.y, t.clientX, t.clientY);
  }, { passive: false });

  joystickEl.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    e.preventDefault();
    const t = e.touches[0];
    const c = getJoystickCenter();
    handleJoystickMove(c.x, c.y, t.clientX, t.clientY);
  }, { passive: false });

  joystickEl.addEventListener('touchend', resetKnob);
  joystickEl.addEventListener('touchcancel', resetKnob);

  // swipe on canvas (still works on touch devices without joystick)
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) send({ type: 'dir', x: dx > 0 ? 1 : -1, y: 0 });
    else send({ type: 'dir', x: 0, y: dy > 0 ? 1 : -1 });
    touchStart = null;
  }, { passive: true });

  createBtn.addEventListener('click', async () => {
    menuError.textContent = '';
    try {
      if (!ws || ws.readyState !== 1) await connect();
      send({
        type: 'create',
        name: getName(),
        roomName: roomNameInput.value.trim() || 'Room',
        maxPlayers: parseInt(maxPlayersSelect.value),
        mapTheme: mapSelect.value,
        skin: selectedSkin,
        color: selectedColor,
      });
    } catch (err) {
      menuError.textContent = err.message;
    }
  });

  joinBtn.addEventListener('click', async () => {
    menuError.textContent = '';
    const code = codeInput.value.trim().toUpperCase();
    if (code.length !== 4) {
      menuError.textContent = 'Enter a 4-character room code.';
      return;
    }
    try {
      if (!ws || ws.readyState !== 1) await connect();
      send({ type: 'join', name: getName(), code, skin: selectedSkin, color: selectedColor });
    } catch (err) {
      menuError.textContent = err.message;
    }
  });

  startGameBtn.addEventListener('click', () => send({ type: 'start' }));
  playAgainBtn.addEventListener('click', () => send({ type: 'start' }));

  leaveBtn.addEventListener('click', () => {
    if (ws) ws.close();
    ws = null;
    lastState = null;
    myId = null;
    isHost = false;
    showScreen(menuScreen);
  });

  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') joinBtn.click();
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') createBtn.click();
  });

  // skin picker
  function drawSkinPreview(canvasEl, skin) {
    const c = canvasEl.getContext('2d');
    c.clearRect(0, 0, canvasEl.width, canvasEl.height);
    const CELL = 14;
    const y = 1;
    const snake = [
      { x: 4, y: y }, { x: 3, y: y }, { x: 2, y: y }, { x: 1, y: y }, { x: 0, y: y },
    ];
    drawSnake(c, snake, { x: 1, y: 0 }, selectedColor, skin, CELL);
  }

  function renderSkinPreviews() {
    skinPicker.querySelectorAll('.skin-option').forEach(btn => {
      const skin = btn.dataset.skin;
      const previewCanvas = btn.querySelector('canvas');
      if (previewCanvas) drawSkinPreview(previewCanvas, skin);
      btn.classList.toggle('selected', skin === selectedSkin);
    });
  }

  function renderColorPicker() {
    colorPicker.querySelectorAll('.color-dot').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.color === selectedColor);
    });
  }

  skinPicker.addEventListener('click', e => {
    const btn = e.target.closest('.skin-option');
    if (!btn) return;
    selectedSkin = btn.dataset.skin;
    localStorage.setItem('snake.skin', selectedSkin);
    renderSkinPreviews();
  });

  colorPicker.addEventListener('click', e => {
    const btn = e.target.closest('.color-dot');
    if (!btn) return;
    selectedColor = btn.dataset.color;
    localStorage.setItem('snake.color', selectedColor);
    renderColorPicker();
    renderSkinPreviews();
  });

  renderSkinPreviews();
  renderColorPicker();

  // --- lobby pickers ---
  function renderLobbyPickers() {
    lobbySkinPicker.querySelectorAll('.skin-option').forEach(btn => {
      const skin = btn.dataset.skin;
      const previewCanvas = btn.querySelector('canvas');
      if (previewCanvas) drawSkinPreview(previewCanvas, skin);
      btn.classList.toggle('selected', skin === selectedSkin);
    });
    lobbyColorPicker.querySelectorAll('.color-dot').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.color === selectedColor);
    });
  }

  lobbySkinPicker.addEventListener('click', e => {
    const btn = e.target.closest('.skin-option');
    if (!btn) return;
    selectedSkin = btn.dataset.skin;
    localStorage.setItem('snake.skin', selectedSkin);
    renderLobbyPickers();
    renderSkinPreviews();
    send({ type: 'setSkin', skin: selectedSkin });
  });

  lobbyColorPicker.addEventListener('click', e => {
    const btn = e.target.closest('.color-dot');
    if (!btn) return;
    selectedColor = btn.dataset.color;
    localStorage.setItem('snake.color', selectedColor);
    renderLobbyPickers();
    renderColorPicker();
    renderSkinPreviews();
    send({ type: 'setColor', color: selectedColor });
  });

  lobbyMapSelect.addEventListener('change', () => {
    if (!isHost) return;
    send({ type: 'setMap', map: lobbyMapSelect.value });
  });
})();
</script>
</body>
</html>
