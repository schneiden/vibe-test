<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #22c55e;
    --accent-dark: #15803d;
    --food: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --grid: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }
  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 16px;
  }
  .hud span b { color: var(--accent); }
  .board-wrap {
    position: relative;
    background: var(--panel);
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: #0b1222;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--muted); max-width: 320px; }
  button {
    background: var(--accent);
    color: #062312;
    border: none;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: var(--accent-dark); color: white; }
  button:active { transform: scale(0.97); }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .footer {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  kbd {
    background: #334155;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 12px;
    color: var(--text);
  }
  /* Mobile touch pad */
  .touchpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .touchpad button {
    padding: 0;
    font-size: 22px;
    background: #334155;
    color: var(--text);
  }
  .touchpad .up    { grid-column: 2; grid-row: 1; }
  .touchpad .left  { grid-column: 1; grid-row: 2; }
  .touchpad .right { grid-column: 3; grid-row: 2; }
  .touchpad .down  { grid-column: 2; grid-row: 3; }
  @media (max-width: 640px) {
    .touchpad { display: grid; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>SNAKE</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Speed: <b id="speed">1</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">Ready to play?</h2>
      <p id="overlay-text">Use <kbd>WASD</kbd> or arrow keys to move. Press <kbd>P</kbd> to pause.</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
  <div class="controls">
    <button id="pause-btn">Pause (P)</button>
    <button id="reset-btn">Reset</button>
  </div>
  <div class="touchpad" id="touchpad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
    <button class="down" data-dir="down">&#9660;</button>
  </div>
  <div class="footer">Eat the red food. Don't bite yourself.</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 24;
  const ROWS = 24;
  const CELL = canvas.width / COLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const resetBtn = document.getElementById('reset-btn');

  const STATE = { IDLE: 'idle', RUNNING: 'running', PAUSED: 'paused', OVER: 'over' };
  let state = STATE.IDLE;
  let snake, dir, nextDir, food, score, tickMs, lastTick, rafId;
  let best = Number(localStorage.getItem('snake.best') || 0);
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(COLS / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    tickMs = 140;
    placeFood();
    updateHud();
    draw();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    const level = Math.max(1, Math.floor((160 - tickMs) / 10) + 1);
    speedEl.textContent = level;
  }

  function setDir(nx, ny) {
    // disallow 180 reversal
    if (snake.length > 1 && nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      if (score > best) {
        best = score;
        localStorage.setItem('snake.best', String(best));
      }
      // speed up every 3 points, floor at 60ms
      if (score % 3 === 0 && tickMs > 60) tickMs -= 6;
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
  }

  function draw() {
    // background
    ctx.fillStyle = '#0b1222';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(51,65,85,0.25)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(canvas.width, j * CELL);
      ctx.stroke();
    }

    // food
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i === 0 ? 1 : 0.85 - (i / snake.length) * 0.4;
      ctx.fillStyle = i === 0 ? '#22c55e' : `rgba(34, 197, 94, ${Math.max(0.35, t)})`;
      const pad = i === 0 ? 1 : 2;
      roundRect(
        ctx,
        s.x * CELL + pad,
        s.y * CELL + pad,
        CELL - pad * 2,
        CELL - pad * 2,
        4
      );
      ctx.fill();
    }

    // eyes on head
    const head = snake[0];
    ctx.fillStyle = '#0b1222';
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const offX = dir.x * CELL * 0.18;
    const offY = dir.y * CELL * 0.18;
    const perpX = -dir.y * CELL * 0.2;
    const perpY = dir.x * CELL * 0.2;
    const r = CELL * 0.08;
    ctx.beginPath(); ctx.arc(cx + offX + perpX, cy + offY + perpY, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + offX - perpX, cy + offY - perpY, r, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(ts) {
    if (state !== STATE.RUNNING) return;
    if (!lastTick) lastTick = ts;
    const delta = ts - lastTick;
    if (delta >= tickMs) {
      lastTick = ts;
      step();
      if (state === STATE.RUNNING) draw();
    }
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    if (state === STATE.OVER || state === STATE.IDLE) reset();
    state = STATE.RUNNING;
    overlay.classList.add('hidden');
    lastTick = 0;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function pause() {
    if (state !== STATE.RUNNING) return;
    state = STATE.PAUSED;
    cancelAnimationFrame(rafId);
    showOverlay('Paused', 'Press Resume or hit P to continue.', 'Resume');
  }

  function resume() {
    if (state !== STATE.PAUSED) return;
    state = STATE.RUNNING;
    overlay.classList.add('hidden');
    lastTick = 0;
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (state === STATE.RUNNING) pause();
    else if (state === STATE.PAUSED) resume();
  }

  function gameOver() {
    state = STATE.OVER;
    cancelAnimationFrame(rafId);
    draw();
    showOverlay(
      'Game Over',
      `You scored ${score}. Best: ${best}.`,
      'Play Again'
    );
  }

  function showOverlay(title, text, btn) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  // input
  const keyMap = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  window.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P') { togglePause(); e.preventDefault(); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === STATE.IDLE || state === STATE.OVER) start();
      else if (state === STATE.PAUSED) resume();
      e.preventDefault();
      return;
    }
    const m = keyMap[e.key];
    if (m) {
      setDir(m[0], m[1]);
      if (state === STATE.IDLE) start();
      e.preventDefault();
    }
  });

  startBtn.addEventListener('click', () => {
    if (state === STATE.PAUSED) resume();
    else start();
  });
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', () => {
    cancelAnimationFrame(rafId);
    state = STATE.IDLE;
    reset();
    showOverlay('Ready to play?', 'Use WASD or arrow keys to move. Press P to pause.', 'Start Game');
  });

  // touchpad
  document.getElementById('touchpad').addEventListener('click', e => {
    const b = e.target.closest('button[data-dir]');
    if (!b) return;
    const d = b.dataset.dir;
    if (d === 'up') setDir(0, -1);
    else if (d === 'down') setDir(0, 1);
    else if (d === 'left') setDir(-1, 0);
    else if (d === 'right') setDir(1, 0);
    if (state === STATE.IDLE || state === STATE.OVER) start();
  });

  // swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    if (state === STATE.IDLE || state === STATE.OVER) start();
    touchStart = null;
  }, { passive: true });

  reset();
})();
</script>
</body>
</html>
